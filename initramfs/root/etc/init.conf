# /etc/init.conf - services /sbin/init (pid 1) starts at boot
service tickd /bin/tickd caps=ipc restart=always
service flapd /bin/flapd caps=- restart=always
# V0.11: the local inference service - the diagnostic model in Ring 3.
service inferd /bin/inferd caps=ipc,fs_read restart=always
# V0.11 test fixture: fails while the system is young, runs once retried.
service flakyd /bin/flakyd caps=- restart=always
