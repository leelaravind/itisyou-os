[package]
name = "image-builder"
version.workspace = true
edition.workspace = true
description = "Builds bootable BIOS/UEFI disk images from the kernel ELF binaries (pure Rust, no external image tools)"

[dependencies]
anyhow = "1"
# The workspace nightly is pinned to 2026-08-01 specifically so the UEFI
# stage links (rust-osdev/bootloader#579 broke later nightlies). If the pin
# ever has to move past the regression, build BIOS-only with
# `--no-default-features`.
bootloader = { version = "0.11.17", default-features = false, features = ["bios"] }

[features]
default = ["uefi"]
uefi = ["bootloader/uefi"]

# NOTE: the kernel is deliberately NOT an artifact dependency. Cargo's
# unstable bindeps feature unifies crate features across the host/bare-metal
# boundary (observed on Linux CI: bitflags built for x86_64-unknown-none
# with `std` enabled) and `cargo tree` panics on such graphs. Instead this
# tool invokes `cargo build -p itisyou-kernel` as a subprocess — separate
# resolution, identical behavior on every platform.
