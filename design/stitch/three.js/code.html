<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Group to hold architecture layers
const architectureGroup = new THREE.Group();
scene.add(architectureGroup);

const layerCount = 6;
const layerSpacing = 0.8;
const layerSize = 2.5;

const layers = [
    { name: 'Applications', status: 'dimmed' },
    { name: 'System Services', status: 'dimmed' },
    { name: 'Policy Layer', status: 'dimmed' },
    { name: 'Syscall Boundary', status: 'dimmed' },
    { name: 'Kernel', status: 'active' },
    { name: 'Hardware', status: 'dimmed' }
];

layers.forEach((layer, i) => {
    const geometry = new THREE.PlaneGeometry(layerSize, layerSize * 0.6);
    const opacity = layer.status === 'active' ? 0.3 : 0.05;
    const color = layer.status === 'active' ? 0x4488ff : 0xffffff;
    
    const material = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: opacity,
        side: THREE.DoubleSide,
        wireframe: true
    });
    
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.y = (i - (layerCount - 1) / 2) * -layerSpacing;
    mesh.rotation.x = -Math.PI / 3;
    architectureGroup.add(mesh);
    
    // Solid edge
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity * 2 }));
    line.position.copy(mesh.position);
    line.rotation.copy(mesh.rotation);
    architectureGroup.add(line);
});

// Subtle signals
const signals = [];
function createSignal() {
    const geometry = new THREE.SphereGeometry(0.02, 8, 8);
    const material = new THREE.MeshBasicMaterial({ color: 0x4488ff });
    const signal = new THREE.Mesh(geometry, material);
    signal.position.y = 2;
    signal.position.x = (Math.random() - 0.5) * layerSize;
    signal.position.z = (Math.random() - 0.5) * layerSize * 0.6;
    architectureGroup.add(signal);
    signals.push({ mesh: signal, speed: 0.01 + Math.random() * 0.02 });
}

setInterval(() => {
    if (signals.length < 20) createSignal();
}, 500);

function animate() {
    requestAnimationFrame(animate);
    
    architectureGroup.rotation.y += 0.002;
    
    for (let i = signals.length - 1; i >= 0; i--) {
        signals[i].mesh.position.y -= signals[i].speed;
        if (signals[i].mesh.position.y < -2) {
            architectureGroup.remove(signals[i].mesh);
            signals.splice(i, 1);
        }
    }
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
