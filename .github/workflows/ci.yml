            --require "PROCPROBE-SLEEP-OK requested=50" \
            --require "run: /bin/proc-probe: Exit(0)" \
            --require "shutting down (QEMU exit)" \
            --forbid "ARGS-SPAWN-FAILED" \
            --forbid "PROCPROBE-SLEEP-SHORT" \
            --forbid "paused=false judged=true starved=true" \
