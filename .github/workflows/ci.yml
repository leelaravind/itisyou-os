      - name: QEMU always-on co-scheduling, what pause stops (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img --expect B200 \
            --send "sched pause" \
            --send "busy 1000" \
            --send "run /bin/tick-client" \
            --send "sched last" \
            --send "sched resume" \
            --send "shutdown" \
