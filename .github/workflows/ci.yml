name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: Kernel build, tests, QEMU boot matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact nightly + components + target.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # Host and kernel are linted in separate invocations on purpose —
      # see the default-members note in Cargo.toml.
      - name: Clippy host packages (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy kernel (deny warnings)
        run: cargo clippy -p itisyou-kernel -- -D warnings

      - name: Host unit tests
        run: cargo test -p kernel-core -p image-builder -p qemu-runner

      - name: Build bootable images
        run: cargo run -p image-builder -- target/images

      # The release pipeline: these exact bytes are what a release publishes.
      # image-builder normalizes the GPT GUIDs, so two runs over the same
      # kernel source must print identical digests - the reproducibility
      # evidence is the comparison of this line across runs.
      - name: Release image digests
        run: |
          cat target/images/manifest.txt
          sha256sum target/images/itisyou-kernel-bios.img target/images/itisyou-kernel-uefi.img

      - name: Upload release boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: |
            target/images/itisyou-kernel-bios.img
            target/images/itisyou-kernel-uefi.img
            target/images/manifest.txt
          if-no-files-found: error
          retention-days: 90

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: QEMU boot smoke (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B010 --expect B020 --expect B030 \
            --exit-after-markers \
            --timeout-secs 120 --label boot-smoke-bios

      - name: QEMU boot smoke (UEFI)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-uefi.img --uefi \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --expect B010 --expect B020 --expect B030 \
            --exit-after-markers \
            --timeout-secs 120 --label boot-smoke-uefi

      - name: QEMU selftest (UEFI)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-selftest-uefi.img --uefi --nvme \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --expect B010 --expect B020 --expect B030 --expect B140 \
            --expect B160 --expect-selftest \
            --require "RING3-HELLO" --require "RING3-DONE" \
            --require "RING3-PARENT-DONE" --require "RING3-PARENT-IPC-OK" \
            --require "nvme_ready blocks=" --require "SPIN-FINITE-OK" \
            --require "gfx width=" --require "RING3-GUI-OK" \
            --expect B170 --expect B180 \
            --timeout-secs 420 --label selftest-uefi

      - name: QEMU selftest (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-selftest-bios.img --nvme \
            --expect B010 --expect B020 --expect B030 --expect B140 \
            --expect B160 --expect-selftest \
            --require "RING3-HELLO" --require "RING3-DONE" \
            --require "user_exit pid=" --require "contained=true" \
            --require "RING3-PARENT-DONE" --require "RING3-PARENT-WAIT-OK" \
            --require "RING3-PARENT-IPC-OK" --require "RING3-CHILD-EXIT" \
            --require "NVMe controller" --require "nvme_ready blocks=" \
            --require "SPIN-FINITE-OK" \
            --require "gfx width=" --require "RING3-GUI-OK" \
            --expect B170 --expect B180 \
            --timeout-secs 420 --label selftest-bios

      - name: QEMU shell interaction (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B040 --expect B050 --expect B060 --expect B070 \
            --expect B080 --expect B090 --expect B100 --expect B110 \
            --expect B120 --expect B130 --expect B140 --expect B150 \
            --expect B160 \
            --send help --send version --send memory --send tasks \
            --send "ls /" --send "cat /etc/version" \
            --send "run /bin/init" --send shutdown \
            --require "itisyou-os 0.10.0-dev" \
            --require "task 0: kmain" \
            --require "RING3-DONE" \
            --require "run: /bin/init: Exit(0)" \
            --require "shutting down (QEMU exit)" \
            --timeout-secs 180 --label shell-test-bios

      - name: QEMU desktop graphics + PS/2 input (BIOS)
        run: |
          # Boot to the shell, enter the graphical desktop, then inject real
          # keyboard + mouse events through the QEMU monitor into the emulated
          # PS/2 devices. The kernel's IRQ1/IRQ12 handlers observe them (INPUT
          # markers) and the compositor renders + screendumps the desktop -
          # the OS produces the UI, no host rendering. DESKTOP-INPUT-VERIFIED
          # proves the full graphics+input path.
          mkdir -p artifacts/qemu
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B170 --expect B180 \
            --send desktop \
            --inject-after DESKTOP-READY \
            --monitor-cmd "sendkey h" --monitor-cmd "sendkey e" \
            --monitor-cmd "sendkey l" --monitor-cmd "sendkey l" \
            --monitor-cmd "sendkey o" \
            --monitor-cmd "mouse_move 40 25" --monitor-cmd "mouse_move -20 15" \
            --monitor-cmd "mouse_button 1" --monitor-cmd "mouse_button 0" \
            --monitor-cmd "screendump artifacts/qemu/desktop.ppm" \
            --monitor-cmd "sendkey esc" \
            --require "[ITISYOU:MODE] desktop" \
            --require "DESKTOP-READY" \
            --require "[ITISYOU:INPUT] key=h" \
            --require "[ITISYOU:INPUT] key=o" \
            --require "[ITISYOU:INPUT] mouse dx=" \
            --require "DESKTOP-INPUT-VERIFIED" \
            --timeout-secs 180 --label desktop-input-bios

      - name: QEMU device model + AC97 audio (BIOS)
        run: |
          # AC97 output -> WAV (QEMU `wav` backend). The OS binds the ac97
          # driver (B190 device model), `beep` synthesizes a tone and DMAs it
          # through the PCM-Out bus master, and the runner asserts the init +
          # full-consumption markers AND that the captured WAV is non-silent -
          # proof the samples traversed driver -> controller -> output.
          mkdir -p artifacts/qemu
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B190 \
            --audio --audio-out artifacts/qemu/audio.wav \
            --send lsdev --send beep --send shutdown \
            --require "devmodel devices=" \
            --require "driver_bound name=" --require "ac97 init" \
            --require "ac97 play" --require "halted=true" \
            --timeout-secs 180 --label audio-bios

      - name: QEMU USB (UHCI) enumeration + HID input into the desktop (BIOS)
        run: |
          # UHCI controller + USB HID keyboard. The OS binds the uhci driver
          # (B190), resets the root port, enumerates over control transfers
          # (device + config descriptors, SET_ADDRESS/CONFIG/PROTOCOL). The
          # graphical desktop then polls the HID interrupt endpoint through the
          # unified input queue (same InputEvent stream as PS/2); an injected
          # keypress reaches the desktop tagged src=usb - real USB HID input
          # AND input-source unification, verified.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B190 --usb \
            --send desktop \
            --inject-after DESKTOP-READY \
            --monitor-cmd "sendkey g" --monitor-cmd "sendkey esc" \
            --require "uhci ready" --require "usb device vendor=" \
            --require "usb hid iface=" --require "key=g src=usb" \
            --require "DESKTOP-INPUT-VERIFIED" \
            --timeout-secs 180 --label usb-hid-bios

      - name: QEMU xHCI enumeration + HID input
        run: |
          # A structurally different USB controller from UHCI: ring-based
          # and command-driven rather than a frame list the controller
          # walks. Proves the whole chain - reset, command and event rings,
          # Enable Slot, Address Device, two control IN transfers,
          # Configure Endpoint, SET_CONFIGURATION/SET_PROTOCOL, and an
          # interrupt transfer carrying a real keypress tagged src=xhci.
          cargo run -q -p qemu-runner --             --image target/images/itisyou-kernel-bios.img             --xhci --expect B190 --expect B210             --send "lsdev" --send "xhciwait"             --inject-after "XHCI-HID-WAITING"             --monitor-cmd "sendkey g"             --send "shutdown"             --require "xhci ready caplength="             --require "xhci device vendor=0x0627"             --require "xhci hid iface=0 endpoint=0x81"             --require "XHCI-HID-REPORT bytes=8"             --require "ascii=g"             --require "[ITISYOU:INPUT] key=g src=xhci"             --forbid "xhci enumerate_failed"             --timeout-secs 300 --label xhci-hid-bios

      - name: QEMU system platform (caps, sandbox, services, packages)
        run: |
          # V0.7 driven through the shell over a persistent NVMe store: a
          # zero-capability probe proves default deny; a sandboxed fs-probe
          # proves the path sandbox; the supervisor runs services (echod
          # serves a client, crashd restarts 3x then Failed); packages
          # install/launch/update/rollback with hello-app under manifest-only
          # capabilities; the audit trail records denials + privileged ops.
          rm -f artifacts/platform-test.img
          cargo run -q -p qemu-runner --             --image target/images/itisyou-kernel-bios.img             --nvme-persist artifacts/platform-test.img             --expect B190             --send "run /bin/sandbox-probe -"             --send "run /bin/cap-handle-probe"             --send "run /bin/fs-probe fs_read /etc"             --send "svc"             --send "pkg install /pkgs/hello-app-1.itpkg"             --send "pkg install /pkgs/hello-app-bad.itpkg"             --send "pkg install /pkgs/hello-app-unsigned.itpkg"             --send "pkg install /pkgs/hello-app-untrusted.itpkg"             --send "pkg install /pkgs/hello-app-forged.itpkg"             --send "pkg launch hello-app"             --send "pkg install /pkgs/hello-app-2.itpkg"             --send "pkg rollback hello-app"             --send "pkg launch hello-app"             --send "pkg list"             --send "audit"             --send "shutdown"             --require "SANDBOX-DENIED-OK" --require "FS-SANDBOX-OK"             --require "CAPH-FORGED-DENIED" --require "CAPH-EXPIRED-DENIED"             --require "CAPH-REVOKED-DENIED" --require "CAPH-ENFORCEMENT-OK" --require "CAPH-NULL-LIST-OK"             --require "reason=expired" --require "reason=no_handle"             --require "ECHOD-SERVED-3" --require "SVC-CLIENT-OK"             --require "name=crashd state=failed pid=" --require "restarts=3"             --require "install name=hello-app v=1 result=ok"             --require "verify result=refused reason=DigestMismatch"             --require "signature result=ok signer="             --require "signature result=refused reason=unsigned"             --require "signature result=refused reason=untrusted_signer"             --require "signature result=refused reason=bad_signature"             --require "action=pkg_verify_signature cap=0x0 result=denied"             --require "action=pkg_launch_signature"             --require "HELLO-APP-OK"             --require "rollback name=hello-app from=v2 to=v1 result=ok"             --require "result=denied"             --timeout-secs 300 --label platform-bios
          rm -f artifacts/platform-test.img

      - name: QEMU networking (e1000 + ARP/IPv4/ICMP/UDP/DNS, BIOS)
        run: |
          # The runner's own host-side Ethernet peer is the entire network:
          # a dgram netdev, no slirp, no host resolver, nothing outside this
          # runner. The peer is an independent implementation, so a bug in
          # the guest's codec cannot cancel itself out against the same code.
          # Proves both directions (client AND responder), the capability
          # gate, and that five hostile frames are refused and answered by
          # nothing.
          cargo run -q -p qemu-runner --             --image target/images/itisyou-kernel-bios.img             --net --expect B190 --expect B200             --send "run /bin/net-probe network"             --send "run /bin/net-denied -"             --send "ping 10.0.2.2 2"             --send "resolve os.itisyou.app"             --send "net" --send "audit" --send "shutdown"             --require "nic_ready driver=e1000 mac=52:54:00:12:34:56 link_up=true"             --require "iface_up ip=10.0.2.15 gateway=10.0.2.2"             --require "NETPROBE-IFACE mac=52:54:00:12:34:56 ip=10.0.2.15 link_up=1"             --require "NETPROBE-BOUND port=40100"             --require "NETPROBE-ECHO-OK bytes=25 from=10.0.2.2"             --require "NETPROBE-RESOLVE-OK name=os.itisyou.app address=93.184.216.34"             --require "NETPROBE-OK"             --require "NETDENY-OK call=net_info"             --require "NETDENY-OK call=udp_bind"             --require "NETDENY-OK call=udp_send"             --require "NETDENY-OK call=udp_recv"             --require "NETDENY-OK call=net_resolve"             --require "NETDENY-ALL-DENIED"             --require "action=udp_bind cap=0x0 result=denied"             --require "kind=network reason=no_handle"             --require "PING-SUMMARY target=10.0.2.2 sent=2 received=2"             --require "RESOLVE-OK name=os.itisyou.app address=93.184.216.34"             --require "[HOST:NET] guest_mac=52:54:00:12:34:56"             --require "[HOST:NET] guest_ip=10.0.2.15"             --require "[HOST:NET] guest_arp_reply from=10.0.2.15"             --require "[HOST:NET] guest_icmp_reply id=4919"             --require "[HOST:NET] dns_query name=os.itisyou.app type=1 class=1"             --require "guest_arp_replies=1 guest_icmp_replies=1 hostile_sent=true replies_to_hostile=0"             --require "bad_ip_csum=0 bad_udp_csum=0 bad_icmp_csum=0"             --require "rx_malformed=3 rx_unwanted=2"             --timeout-secs 300 --label net-bios

      - name: QEMU DHCP against QEMU user-mode networking (BIOS)
        run: |
          # QEMU's DHCP server serves 10.0.9.0/24, not the guest's static
          # plan: the gateway is unreachable before the lease, 10.0.9.50 can
          # only come from it, and the broadcast reply guards the V0.9 fix
          # for broadcast UDP checksums.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --net-user --net-user-extra "net=10.0.9.0/24,dhcpstart=10.0.9.50" \
            --expect B200 \
            --send "ping 10.0.9.2 1" --send "dhcp" --send "net" \
            --send "ping 10.0.9.2 2" --send "shutdown" \
            --require "PING-SUMMARY target=10.0.9.2 sent=1 received=0" \
            --require "dhcp_offer ip=10.0.9.50 server=10.0.9.2" \
            --require "dhcp_lease ip=10.0.9.50 mask=255.255.255.0 router=10.0.9.2 dns=10.0.9.3 server=10.0.9.2 lease_secs=86400" \
            --require "DHCP-OK ip=10.0.9.50" \
            --require "net: mac=52:54:00:12:34:56 ip=10.0.9.50 mask=255.255.255.0 gateway=10.0.9.2" \
            --require "PING-SUMMARY target=10.0.9.2 sent=2 received=2" \
            --require "action=dhcp_lease cap=0x0 result=ok" \
            --forbid "DHCP-FAILED" \
            --timeout-secs 240 --label net-dhcp-bios

      - name: QEMU IPv6 foundations against QEMU user-mode networking (BIOS)
        run: |
          # Link-local from the MAC, router solicitation, SLAAC from the
          # advertised prefix, neighbour resolution and ICMPv6 echo against
          # QEMU's own IPv6 router - with IPv4 still working alongside.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img --net-user \
            --expect B200 \
            --send "ipv6" --send "ping6 fec0::2 2" --send "ping 10.0.2.2 1" \
            --send "net" --send "shutdown" \
            --require "[ITISYOU:NET6] up link_local=fe80::5054:ff:fe12:3456" \
            --require "[ITISYOU:NET6] slaac global=fec0::5054:ff:fe12:3456 router=fe80::2" \
            --require "IPV6-OK global=fec0::5054:ff:fe12:3456" \
            --require "PING6-SUMMARY target=fec0::2 sent=2 received=2" \
            --require "PING-SUMMARY target=10.0.2.2 sent=1 received=1" \
            --require "rx_malformed=0 rx_unwanted=0 router_adverts=1" \
            --forbid "IPV6-NO-ROUTER" \
            --timeout-secs 240 --label net-ipv6-bios

      - name: QEMU IPv6 responder paths against the harness peer (BIOS)
        run: |
          # The harness's own peer solicits the guest's link-local address and
          # pings it (QEMU's router never does); every ICMPv6 checksum is
          # checked by the peer's independent code.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img --net \
            --expect B200 --send "ipv6" --send "net poll 3000" --send "net" --send "shutdown" \
            --require "net: polled ms=3000" \
            --require "IPV6-NO-ROUTER (link-local only)" \
            --require "[HOST:NET6] guest_na target=fe80:0:0:0:5054:ff:fe12:3456 solicited=true override=true" \
            --require "[HOST:NET6] guest_echo6_reply from=fe80:0:0:0:5054:ff:fe12:3456 payload_ok=true" \
            --require "neighbor_adverts_sent=1 echo_replies_sent=1" \
            --require "guest_na=1 guest_icmp6_replies=1 bad_icmp6_csum=0" \
            --timeout-secs 240 --label net-ipv6-responder-bios

      - name: QEMU TCP stream against the host OS TCP stack (BIOS)
        run: |
          # slirp maps the guest's 10.0.2.2 to the host's loopback, so the
          # peer is the host's own TCP stack; the echo endpoint checks the
          # pattern itself. Clean stream, then two injected losses recovered
          # by retransmission, then the capability denial.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --net-user --tcp-echo-port 47123 --tcp-client-forward 7 --expect B200 \
            --send "tcp serve 7" \
            --send "run /bin/tcp-probe network" --send "tcp drop 2" \
            --send "run /bin/tcp-probe network" --send "run /bin/tcp-probe -" \
            --send "run /bin/tcp-server-probe network" --send "run /bin/tcp-server-probe -" \
            --send "tcp" --send "shutdown" \
            --require 'action=tcp_connect cap=0x100 result=ok' \
            --require 'TCPPROBE-CONNECTED' \
            --require 'TCPPROBE-NULL-SEND-OK' \
            --require 'TCPPROBE-ECHO-OK bytes=3000' \
            --require 'TCPPROBE-CLOSED' \
            --require 'TCPPROBE-OK' \
            --require 'TCPSERVE-LISTENING port=7' \
            --require 'TCPSERVE-ACCEPTED from=10.0.2.2:' \
            --require 'TCPSERVE-ECHOED bytes=2500' \
            --require 'TCPSERVE-CLOSED echoed=2500' \
            --require '[HOST:TCPC] echo_ok' \
            --require 'TCPSERVE-LISTENING port=7 ring=3' \
            --require 'action=tcp_listen cap=0x100 result=ok' \
            --require 'TCPSERVER-ACCEPTED' \
            --require 'TCPSERVER-ECHOED bytes=2500' \
            --require 'TCPSERVER-OK' \
            --require 'TCPSERVER-DENIED call=tcp_listen' \
            --require 'exchanges=2 attempts=2 echo_ok=true bytes=5000' \
            --forbid 'TCPSERVER-FAILED' \
            --forbid 'owner_state=dead' \
            --require '[ITISYOU:TCP] injected_loss seq=' \
            --require '[ITISYOU:TCP] retransmit seq=' \
            --require 'injected_losses=2' \
            --require 'malformed=0' \
            --require 'TCPPROBE-DENIED call=tcp_connect' \
            --require 'action=tcp_connect cap=0x0 result=denied' \
            --require '[HOST:TCP] summary connections=2 bytes_in=6000 bytes_out=6000 pattern_ok=true clean_close=true' \
            --forbid "TCPPROBE-FAILED" \
            --timeout-secs 300 --label net-tcp-bios

      - name: QEMU signing-key hierarchy (BIOS)
        run: |
          # Offline root, certified signing keys with scopes and epoch
          # windows, a signed revocation list; each refusal has its own reason.
          rm -f artifacts/trust-test.img
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --nvme-persist artifacts/trust-test.img --expect B190 \
            --send "pkg trust" \
            --send "pkg install /pkgs/hello-app-1.itpkg" \
            --send "pkg install /pkgs/hello-app-retired.itpkg" \
            --send "pkg install /pkgs/hello-app-expired.itpkg" \
            --send "pkg install /pkgs/hello-app-rogue.itpkg" \
            --send "pkg install /pkgs/other-app-1.itpkg" \
            --send "pkg install /pkgs/hello-app-untrusted.itpkg" \
            --send "pkg launch hello-app" \
            --send "pkg list" \
            --send "shutdown" \
            --require '[ITISYOU:TRUST] root=679e3823 epoch=9' \
            --require 'cert file=rogue-signer.cert result=rejected reason=bad_root_signature' \
            --require 'action=trust_load_certificate cap=0x0 result=denied' \
            --require 'revocations seq=1 count=1 result=ok' \
            --require 'certs_loaded=4 rejected=1' \
            --require 'label=retired-signer' \
            --require 'epochs=9..=12 state=revoked' \
            --require 'epochs=7..=8 state=expired' \
            --require 'signature result=ok signer=c645535e key_id=1 label=test-signer' \
            --require 'install name=hello-app v=1 result=ok' \
            --require 'signature result=refused reason=revoked_signer' \
            --require 'signature result=refused reason=certificate_expired' \
            --require 'signature result=refused reason=out_of_scope' \
            --require 'signature result=refused reason=untrusted_signer' \
            --require 'HELLO-APP-OK' \
            --forbid 'stage name=other-app' \
            --forbid 'store v2' \
            --timeout-secs 300 --label trust-bios
          rm -f artifacts/trust-test.img

      - name: QEMU kernel stack guard (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B080 --expect B200 --send "panic-test stack-overflow" --expect-panic \
            --require "stack_guard stack=priv" --require "stack_guard stack=ist_double_fault" \
            --require "armed=true unmapped=true" --require "kernel_stack_overflow stack=priv" \
            --require "guard_hit=true" \
            --require "kernel stack overflow: stack=priv hit its guard page" \
            --forbid "armed=false" \
            --timeout-secs 120 --label stack-guard-bios

      - name: QEMU line-atomic Ring 3 output (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img --expect B200 \
            --send "bg /bin/line-probe spawn" --send "shutdown" \
            --require "LINEPROBE-A-0123456789abcdefghijklmnopqrstuv" \
            --require "LINEPROBE-B-0123456789abcdefghijklmnopqrstuv" \
            --require "[RING3-U:SVC] spoofed-by-ring3" --require "LINEPROBE-OK" \
            --forbid "[ITISYOU:SVC] spoofed-by-ring3" --forbid "LINEPROBE-FAILED" \
            --timeout-secs 240 --label line-atomic-bios

      - name: QEMU kernel copies refuse read-only user memory (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img --expect B200 \
            --send "run /bin/uaccess-probe - - -- probe" --send "shutdown" \
            --require "UACCESS-ARGS-RO-REFUSED" --require "UACCESS-CAPLIST-RO-REFUSED" \
            --require "UACCESS-RW-OK" --require "UACCESS-OK" \
            --require "run: /bin/uaccess-probe: Exit(0)" \
            --require "shutting down (QEMU exit)" \
            --forbid "UACCESS-FAILED" \
            --timeout-secs 120 --label uaccess-bios

      - name: QEMU process model (BIOS)
        run: |
