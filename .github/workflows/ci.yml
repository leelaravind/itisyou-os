name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: Kernel build, tests, QEMU boot matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact nightly + components + target.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # Host and kernel are linted in separate invocations on purpose —
      # see the default-members note in Cargo.toml.
      - name: Clippy host packages (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy kernel (deny warnings)
        run: cargo clippy -p itisyou-kernel -- -D warnings

      - name: Host unit tests
        run: cargo test -p kernel-core -p image-builder -p qemu-runner

      - name: Build bootable images
        run: cargo run -p image-builder -- target/images

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: QEMU boot smoke (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B010 --expect B020 --expect B030 \
            --exit-after-markers \
            --timeout-secs 120 --label boot-smoke-bios

      - name: QEMU boot smoke (UEFI)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-uefi.img --uefi \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --expect B010 --expect B020 --expect B030 \
            --exit-after-markers \
            --timeout-secs 120 --label boot-smoke-uefi

      - name: QEMU selftest (UEFI)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-selftest-uefi.img --uefi --nvme \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --expect B010 --expect B020 --expect B030 --expect B140 \
            --expect B160 --expect-selftest \
            --require "RING3-HELLO" --require "RING3-DONE" \
            --require "RING3-PARENT-DONE" --require "RING3-PARENT-IPC-OK" \
            --require "nvme_ready blocks=" --require "SPIN-FINITE-OK" \
            --require "gfx width=" --require "RING3-GUI-OK" \
            --expect B170 --expect B180 \
            --timeout-secs 420 --label selftest-uefi

      - name: QEMU selftest (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-selftest-bios.img --nvme \
            --expect B010 --expect B020 --expect B030 --expect B140 \
            --expect B160 --expect-selftest \
            --require "RING3-HELLO" --require "RING3-DONE" \
            --require "user_exit pid=" --require "contained=true" \
            --require "RING3-PARENT-DONE" --require "RING3-PARENT-WAIT-OK" \
            --require "RING3-PARENT-IPC-OK" --require "RING3-CHILD-EXIT" \
            --require "NVMe controller" --require "nvme_ready blocks=" \
            --require "SPIN-FINITE-OK" \
            --require "gfx width=" --require "RING3-GUI-OK" \
            --expect B170 --expect B180 \
            --timeout-secs 420 --label selftest-bios

      - name: QEMU shell interaction (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B040 --expect B050 --expect B060 --expect B070 \
            --expect B080 --expect B090 --expect B100 --expect B110 \
            --expect B120 --expect B130 --expect B140 --expect B150 \
            --expect B160 \
            --send help --send version --send memory --send tasks \
            --send "ls /" --send "cat /etc/version" \
            --send "run /bin/init" --send shutdown \
            --require "itisyou-os 0.5.0-dev" \
            --require "task 0: kmain" \
            --require "RING3-DONE" \
            --require "run: /bin/init: Exit(0)" \
            --require "shutting down (QEMU exit)" \
            --timeout-secs 180 --label shell-test-bios

      - name: QEMU desktop graphics + PS/2 input (BIOS)
        run: |
          # Boot to the shell, enter the graphical desktop, then inject real
          # keyboard + mouse events through the QEMU monitor into the emulated
          # PS/2 devices. The kernel's IRQ1/IRQ12 handlers observe them (INPUT
          # markers) and the compositor renders + screendumps the desktop -
          # the OS produces the UI, no host rendering. DESKTOP-INPUT-VERIFIED
          # proves the full graphics+input path.
          mkdir -p artifacts/qemu
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B170 --expect B180 \
            --send desktop \
            --inject-after DESKTOP-READY \
            --monitor-cmd "sendkey h" --monitor-cmd "sendkey e" \
            --monitor-cmd "sendkey l" --monitor-cmd "sendkey l" \
            --monitor-cmd "sendkey o" \
            --monitor-cmd "mouse_move 40 25" --monitor-cmd "mouse_move -20 15" \
            --monitor-cmd "mouse_button 1" --monitor-cmd "mouse_button 0" \
            --monitor-cmd "screendump artifacts/qemu/desktop.ppm" \
            --monitor-cmd "sendkey esc" \
            --require "[ITISYOU:MODE] desktop" \
            --require "DESKTOP-READY" \
            --require "[ITISYOU:INPUT] key=h" \
            --require "[ITISYOU:INPUT] key=o" \
            --require "[ITISYOU:INPUT] mouse dx=" \
            --require "DESKTOP-INPUT-VERIFIED" \
            --timeout-secs 180 --label desktop-input-bios

      - name: QEMU device model + AC97 audio (BIOS)
        run: |
          # AC97 output -> WAV (QEMU `wav` backend). The OS binds the ac97
          # driver (B190 device model), `beep` synthesizes a tone and DMAs it
          # through the PCM-Out bus master, and the runner asserts the init +
          # full-consumption markers AND that the captured WAV is non-silent -
          # proof the samples traversed driver -> controller -> output.
          mkdir -p artifacts/qemu
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B190 \
            --audio --audio-out artifacts/qemu/audio.wav \
            --send lsdev --send beep --send shutdown \
            --require "devmodel devices=" \
            --require "driver_bound name=" --require "ac97 init" \
            --require "ac97 play" --require "halted=true" \
            --timeout-secs 180 --label audio-bios

      - name: QEMU USB (UHCI) enumeration + HID input into the desktop (BIOS)
        run: |
          # UHCI controller + USB HID keyboard. The OS binds the uhci driver
          # (B190), resets the root port, enumerates over control transfers
          # (device + config descriptors, SET_ADDRESS/CONFIG/PROTOCOL). The
          # graphical desktop then polls the HID interrupt endpoint through the
          # unified input queue (same InputEvent stream as PS/2); an injected
          # keypress reaches the desktop tagged src=usb - real USB HID input
          # AND input-source unification, verified.
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-bios.img \
            --expect B190 --usb \
            --send desktop \
            --inject-after DESKTOP-READY \
            --monitor-cmd "sendkey g" --monitor-cmd "sendkey esc" \
            --require "uhci ready" --require "usb device vendor=" \
            --require "usb hid iface=" --require "key=g src=usb" \
            --require "DESKTOP-INPUT-VERIFIED" \
            --timeout-secs 180 --label usb-hid-bios

      - name: QEMU intentional panic (BIOS)
        run: |
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-kernel-panictest-bios.img \
            --expect B010 --expect B020 --expect-panic \
            --require "intentional panic-test" \
            --timeout-secs 120 --label panic-test-bios

      - name: QEMU filesystem reboot persistence (UEFI, two boots)
        run: |
          # Boot 1 writes /hello + flushes; boot 2 (fresh guest, same disk)
          # verifies it — proving reboot persistence. UEFI path (this binary's
          # BIOS image does not boot; see docs/DEVELOPMENT_STORY).
          rm -f artifacts/fs-persist-ci.img
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-fs-persist-uefi.img --uefi \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --nvme-persist artifacts/fs-persist-ci.img \
            --expect B010 --expect B160 --require "FS-PERSIST-WROTE" \
            --timeout-secs 120 --label fs-persist-write
          cargo run -q -p qemu-runner -- \
            --image target/images/itisyou-fs-persist-uefi.img --uefi \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --nvme-persist artifacts/fs-persist-ci.img \
            --expect B010 --expect B160 --require "FS-PERSIST-VERIFIED" \
            --timeout-secs 120 --label fs-persist-verify
          rm -f artifacts/fs-persist-ci.img

      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-evidence
          path: artifacts/qemu/
          if-no-files-found: ignore

  website:
    name: Website check + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Verify (status sync, astro check, build)
        working-directory: website
        run: npm run verify

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
