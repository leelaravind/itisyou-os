cargo-features = ["per-package-target"]

[package]
name = "user-inferd"
version.workspace = true
edition.workspace = true
description = "/bin/inferd: the local inference service (V0.11) - the diagnostic model in Ring 3."
forced-target = "x86_64-unknown-none"

[dependencies]
ulib = { path = "../ulib" }
kernel-core = { path = "../../crates/kernel-core" }

[[bin]]
name = "user-inferd"
path = "src/main.rs"
test = false
bench = false
