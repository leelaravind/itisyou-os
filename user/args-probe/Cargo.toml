cargo-features = ["per-package-target"]

[package]
name = "user-args-probe"
version.workspace = true
edition.workspace = true
description = "V0.10 program-arguments test program (console and parent-to-child)."
forced-target = "x86_64-unknown-none"

[dependencies]
ulib = { path = "../ulib" }

[[bin]]
name = "user-args-probe"
path = "src/main.rs"
test = false
bench = false
