cargo-features = ["per-package-target"]

[package]
name = "user-sysfuzz"
version.workspace = true
edition.workspace = true
description = "/bin/sysfuzz: seeded random syscalls against the kernel (V1.0 robustness)."
forced-target = "x86_64-unknown-none"

[dependencies]
ulib = { path = "../ulib" }

[[bin]]
name = "user-sysfuzz"
path = "src/main.rs"
test = false
bench = false
