cargo-features = ["per-package-target"]

[package]
name = "user-sysinit"
version.workspace = true
edition.workspace = true
forced-target = "x86_64-unknown-none"
description = "/sbin/init: the userspace init (V0.10). The config grammar and the restart policy are kernel-core's host-tested code."

[dependencies]
ulib = { path = "../ulib" }
kernel-core = { path = "../../crates/kernel-core" }

[[bin]]
name = "user-sysinit"
path = "src/main.rs"
test = false
bench = false
