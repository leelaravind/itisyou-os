cargo-features = ["per-package-target"]

[package]
name = "user-flakyd"
version.workspace = true
edition.workspace = true
description = "/bin/flakyd: a V0.11 fixture service that fails while the system is young and runs once retried."
forced-target = "x86_64-unknown-none"

[dependencies]
ulib = { path = "../ulib" }

[[bin]]
name = "user-flakyd"
path = "src/main.rs"
test = false
bench = false
