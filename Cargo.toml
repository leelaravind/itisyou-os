[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/kernel-core",
    "tools/image-builder",
    "tools/qemu-runner",
    "tools/keytool",
    "user/ulib",
    "user/init",
    "user/gp-test",
    "user/pf-test",
    "user/child",
    "user/parent",
    "user/spin-finite",
    "user/spin-forever",
    "user/gui-demo",
    "user/lsdev",
    "user/sandbox-probe",
    "user/cap-handle-probe",
    "user/cap-parent",
    "user/cap-child",
    "user/fs-probe",
    "user/echo-svc",
    "user/crashy-svc",
    "user/svc-client",
    "user/tickd",
    "user/tick-client",
    "user/flapd",
    "user/net-probe",
    "user/net-denied",
    "user/tcp-probe",
    "user/tcp-server-probe",
    "user/fs-writer",
    "user/fs-write-denied",
    "user/fs-user-persist",
    "user/harden-probe",
    "user/stack-guard-probe",
    "user/hello-app",
    "user/args-probe",
    "user/flags-probe",
    "user/line-probe",
    "user/burn",
    "user/proc-probe",
    "user/uaccess-probe",
    "user/sysinit",
    "user/sh",
    "user/gui-echo",
    "user/ai-probe",
    "user/inferd",
    "user/agent",
    "user/flakyd",
]
# The kernel must NEVER share a cargo invocation with host packages: cargo
# resolves features once per invocation across all compile targets, so a
# host-only dependency enabling e.g. `bitflags/std` (Linux dep graph) would
# poison the x86_64-unknown-none build. Bare `cargo build`/`clippy` operate
# on the host packages; the kernel builds via `-p itisyou-kernel` alone
# (image-builder does this as a subprocess).
default-members = [
    "crates/kernel-core",
    "tools/image-builder",
    "tools/qemu-runner",
    "tools/keytool",
]

[workspace.package]
# The version the kernel reports at boot (`CARGO_PKG_VERSION`). It must equal
# `status/current.json` `version`; `website/scripts/check-consistency.mjs`
# fails the build when they drift. Development builds carry `-dev`; the
# release commit drops it.
version = "0.11.0-dev"
edition = "2021"
authors = ["leelaravind"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# Kernel is always built with panic=abort semantics; dev profile keeps
# debug assertions for early fault detection in QEMU.
[profile.dev]
panic = "abort"
